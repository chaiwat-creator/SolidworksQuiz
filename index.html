<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบทดสอบ SolidWorks - ครบชุด 90 ข้อ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
        .option-btn { transition: all 0.2s ease-in-out; }
        .option-selected {
            background-color: #eff6ff !important;
            border-color: #3b82f6 !important;
            color: #1d4ed8 !important;
            font-weight: 600;
        }
        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- คอนเทนเนอร์หลัก -->
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-6 sm:p-10 transition-all duration-300 relative overflow-hidden">
        
        <!-- แถบสีด้านบนเพื่อความสวยงาม -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-red-600 via-blue-600 to-purple-600"></div>

        <!-- 1. หน้าปก (Start Screen) -->
        <div id="start-screen" class="fade-in text-center py-6">
            <div class="mb-6 inline-block p-4 bg-red-50 rounded-full">
                <!-- ไอคอนจำลองแทนโลโก้ SolidWorks -->
                <svg class="w-16 h-16 text-red-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-800 mb-4">
                SolidWorks <span class="text-red-600">Pro Quiz</span>
            </h1>
            <p class="text-gray-600 text-lg mb-8 max-w-md mx-auto">
                ท้าทายความรู้ด้านการออกแบบ 3 มิติของคุณกับแบบทดสอบมาตรฐาน 90 ข้อ ครอบคลุมทุกทักษะสำคัญจากพื้นฐานถึงระดับกลาง
            </p>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-10">
                <div class="bg-purple-50 p-4 rounded-xl border border-purple-100">
                    <p class="text-purple-700 font-bold text-xl">30 ข้อ</p>
                    <p class="text-purple-600 text-sm">Part Modeling</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-xl border border-blue-100">
                    <p class="text-blue-700 font-bold text-xl">30 ข้อ</p>
                    <p class="text-blue-600 text-sm">Assembly</p>
                </div>
                <div class="bg-green-50 p-4 rounded-xl border border-green-100">
                    <p class="text-green-700 font-bold text-xl">30 ข้อ</p>
                    <p class="text-green-600 text-sm">Drawing</p>
                </div>
            </div>

            <div class="space-y-4">
                <button onclick="startQuiz()" class="w-full sm:w-64 bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-8 rounded-full shadow-lg hover:shadow-xl transition-all duration-200 text-lg">
                    เริ่มทำแบบทดสอบ
                </button>
                <p class="text-gray-400 text-xs">เวลาเฉลี่ยที่ใช้: 25-40 นาที</p>
            </div>
        </div>

        <!-- 2. หน้าจอแสดงแบบทดสอบ (Quiz Screen) -->
        <div id="quiz-screen" class="hidden fade-in">
            <div class="flex flex-wrap justify-between items-center mb-6 gap-3 border-b pb-4">
                <div class="flex items-center gap-2">
                    <span id="question-progress" class="text-sm font-medium text-gray-500 bg-gray-100 py-1 px-3 rounded-full border border-gray-200">
                        ข้อ 1 / 90
                    </span>
                    <span id="category-badge" class="text-sm font-medium py-1 px-3 rounded-full border">
                        หมวดหมู่
                    </span>
                </div>
                <span id="score-live" class="text-sm font-medium text-blue-600 bg-blue-50 py-1 px-3 rounded-full border border-blue-100">
                    คะแนน: 0
                </span>
            </div>

            <h2 id="question-text" class="text-lg sm:text-xl font-semibold text-gray-800 mb-6 leading-relaxed">
                <!-- คำถามจะโหลดที่นี่ -->
            </h2>

            <div id="options-container" class="space-y-3 mb-8">
                <!-- ตัวเลือกจะโหลดที่นี่ -->
            </div>

            <div class="flex justify-end">
                <button id="next-btn" onclick="handleNextClick()" disabled class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-3 px-8 rounded-lg transition-colors duration-200 shadow-md">
                    ยืนยันคำตอบ
                </button>
            </div>
        </div>

        <!-- 3. หน้าจอแสดงผลคะแนน (Result Screen) -->
        <div id="result-screen" class="hidden text-center py-8 fade-in">
            <div class="mb-6">
                <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800">สรุปคะแนนของคุณ</h2>
            </div>
            
            <div class="bg-gray-50 rounded-2xl p-8 mb-8 border border-gray-200 shadow-inner">
                <p class="text-sm text-gray-500 uppercase tracking-widest font-bold mb-2">Total Score</p>
                <p class="text-6xl font-black text-blue-600" id="final-score">0 / 90</p>
                <div id="score-interpretation" class="mt-4 font-medium text-lg"></div>
            </div>

            <button onclick="location.reload()" class="bg-gray-800 hover:bg-gray-900 text-white font-medium py-3 px-10 rounded-full shadow-md transition-all">
                กลับหน้าหลัก
            </button>
        </div>

    </div>

    <script>
        const quizData = [
            // PART MODELING (1-30)
            { category: "Part Modeling", question: "นามสกุลไฟล์ของชิ้นงาน (Part) ในโปรแกรม SolidWorks คืออะไร?", options: [".slddrw", ".sldasm", ".sldprt", ".dwg"], answer: 2 },
            { category: "Part Modeling", question: "ก่อนเริ่มสร้างรูปทรง 3 มิติ (3D Feature) โดยทั่วไปต้องทำสิ่งใดก่อนเป็นอันดับแรก?", options: ["เรนเดอร์ชิ้นงาน (Render)", "สร้าง Sketch 2 มิติ", "เลือกวัสดุ (Material)", "ทำภาพฉาย (Drawing)"], answer: 1 },
            { category: "Part Modeling", question: "คำสั่งใดใช้สำหรับดึงเส้น Sketch 2D ให้มีความหนาหรือยืดออกเป็นรูปทรง 3D?", options: ["Extruded Boss/Base", "Revolved Boss/Base", "Swept Boss/Base", "Lofted Boss/Base"], answer: 0 },
            { category: "Part Modeling", question: "คำสั่งใดใช้สำหรับ 'เจาะเนื้อชิ้นงาน' ให้เป็นรูหรือทะลุตามรูปทรงที่วาดไว้?", options: ["Extruded Cut", "Fillet", "Shell", "Chamfer"], answer: 0 },
            { category: "Part Modeling", question: "หากต้องการลบมุมชิ้นงานให้มี 'ความโค้งมน' ต้องใช้คำสั่งใด?", options: ["Chamfer", "Draft", "Fillet", "Mirror"], answer: 2 },
            { category: "Part Modeling", question: "คำสั่งใดใช้กำหนดขนาดให้กับการสเกตช์อย่างแม่นยำ?", options: ["Measure", "Smart Dimension", "Scale", "Offset"], answer: 1 },
            { category: "Part Modeling", question: "หากต้องการสร้างชิ้นงานรูปทรงที่เกิดจากการหมุนรอบแกน ควรใช้คำสั่งใด?", options: ["Extruded", "Swept", "Revolved", "Lofted"], answer: 2 },
            { category: "Part Modeling", question: "คำสั่ง Shell มีหน้าที่ทำอะไร?", options: ["ทำให้ผิวเรียบ", "เพิ่มความหนาผิว", "ตัดชิ้นงานครึ่งหนึ่ง", "ทำให้ชิ้นงานกลวง"], answer: 3 },
            { category: "Part Modeling", question: "หากต้องการปาดมุมชิ้นงานให้เป็น 'เหลี่ยมตัดตรง' ต้องใช้คำสั่งใด?", options: ["Fillet", "Chamfer", "Trim", "Cut"], answer: 1 },
            { category: "Part Modeling", question: "ระนาบพื้นฐานมี 3 ระนาบ คืออะไรบ้าง?", options: ["Front, Top, Left", "Front, Top, Right", "Top, Bottom, Right", "Front, Back, Top"], answer: 1 },
            { category: "Part Modeling", question: "Vertical Relation บังคับเส้นให้เป็นอย่างไร?", options: ["แนวนอน", "แนวตั้ง", "ขนาน", "ตั้งฉาก"], answer: 1 },
            { category: "Part Modeling", question: "Coincident Relation ใช้ทำอะไร?", options: ["ทำจุดศูนย์กลางร่วม", "ทำให้เส้นสัมผัสกัน", "ผูกจุดสองจุดให้ติดกัน", "แบ่งครึ่งเส้น"], answer: 2 },
            { category: "Part Modeling", question: "คำสั่งคัดลอก Feature ให้สมมาตรกันอีกฝั่งคือ?", options: ["Pattern", "Mirror", "Copy", "Move"], answer: 1 },
            { category: "Part Modeling", question: "Linear Pattern ใช้เรียง Feature แบบใด?", options: ["เส้นตรง", "วงกลม", "ตามเส้นโค้ง", "สุ่ม"], answer: 0 },
            { category: "Part Modeling", question: "Circular Pattern ใช้เรียง Feature แบบใด?", options: ["เส้นตรง", "รอบแกนวงกลม", "สลับฟันปลา", "กระจก"], answer: 1 },
            { category: "Part Modeling", question: "Swept Boss ต้องการอะไรบ้าง?", options: ["Profile อย่างเดียว", "Path อย่างเดียว", "Profile และ Path", "แกนหมุน"], answer: 2 },
            { category: "Part Modeling", question: "Loft Boss ใช้เชื่อมหน้าตัดแบบใด?", options: ["หน้าตัดเดียว", "หลายหน้าตัดที่ต่างรูปร่างกัน", "เฉพาะวงกลม", "เฉพาะสี่เหลี่ยม"], answer: 1 },
            { category: "Part Modeling", question: "เครื่องมือวัดขนาด 3D คือ?", options: ["Ruler", "Measure", "Dimension", "Tape"], answer: 1 },
            { category: "Part Modeling", question: "ตั้งค่าวัสดุ (เหล็ก, ไม้) ที่ไหน?", options: ["Sketch", "Feature", "Material", "Appearance"], answer: 2 },
            { category: "Part Modeling", question: "กดปุ่มไหนที่เมาส์เพื่อหมุนดูชิ้นงาน?", options: ["คลิกซ้าย", "คลิกขวา", "ลูกกลิ้ง (กลาง)", "ปุ่มข้าง"], answer: 2 },
            { category: "Part Modeling", question: "Normal To (Ctrl+8) มีหน้าที่อะไร?", options: ["มองตั้งฉากกับระนาบ", "มองแบบ 3 มิติ", "ซ่อนชิ้นงาน", "จบการทำงาน"], answer: 0 },
            { category: "Part Modeling", question: "เส้นสเกตช์สีดำหมายความว่าอย่างไร?", options: ["ยังไม่กำหนดขนาด", "กำหนดขนาดครบสมบูรณ์ (Fully Defined)", "เส้นเสีย", "เส้นอ้างอิง"], answer: 1 },
            { category: "Part Modeling", question: "Trim Entities ใช้ทำอะไร?", options: ["วาดวงกลม", "ขยายเส้น", "ตัดเส้นส่วนเกิน", "รวมเส้น"], answer: 2 },
            { category: "Part Modeling", question: "Offset Entities ใช้ทำอะไร?", options: ["ย้ายเส้น", "สร้างเส้นขนานตามระยะที่กำหนด", "หมุนเส้น", "ลบเส้น"], answer: 1 },
            { category: "Part Modeling", question: "Convert Entities ใช้ทำอะไร?", options: ["เปลี่ยนสีเส้น", "คัดลอกขอบ 3D มาเป็นเส้น Sketch", "เปลี่ยนหน่วยวัด", "ลบ Sketch"], answer: 1 },
            { category: "Part Modeling", question: "สร้าง Plane ใหม่ต้องไปที่เมนูใด?", options: ["Sketch", "Reference Geometry", "Evaluate", "Add-ins"], answer: 1 },
            { category: "Part Modeling", question: "คำสั่งเอียงผิวเพื่อถอดพิมพ์คือ?", options: ["Shell", "Fillet", "Draft", "Rib"], answer: 2 },
            { category: "Part Modeling", question: "เจาะรูมาตรฐาน (หัวน็อต) ใช้คำสั่ง?", options: ["Cut", "Hole Wizard", "Revolve Cut", "Drill"], answer: 1 },
            { category: "Part Modeling", question: "ประวัติการสร้างชิ้นงานอยู่ที่ไหน?", options: ["Task Pane", "Status Bar", "FeatureManager Design Tree", "Menu Bar"], answer: 2 },
            { category: "Part Modeling", question: "Suppress Feature คืออะไร?", options: ["ลบถาวร", "ระงับการใช้งานชั่วคราว", "เปลี่ยนสี", "รวมกลุ่ม"], answer: 1 },

            // ASSEMBLY (31-60)
            { category: "Assembly", question: "นามสกุลไฟล์ Assembly คือ?", options: [".sldprt", ".sldasm", ".slddrw", ".exe"], answer: 1 },
            { category: "Assembly", question: "คำสั่งดึง Part เข้า Assembly คือ?", options: ["Insert Component", "Add Part", "Import", "Place"], answer: 0 },
            { category: "Assembly", question: "ชิ้นแรกที่ดึงเข้า Assembly จะมีสถานะ?", options: ["Float", "Hidden", "Fixed (ถูกตรึง)", "Transparent"], answer: 2 },
            { category: "Assembly", question: "สัญลักษณ์ Fixed คือ?", options: ["(f)", "(-)", "(+)", "(o)"], answer: 0 },
            { category: "Assembly", question: "คำสั่งกำหนดความสัมพันธ์ใน Assembly คือ?", options: ["Join", "Mate", "Link", "Group"], answer: 1 },
            { category: "Assembly", question: "Coincident Mate คือ?", options: ["ผิวสัมผัสกัน", "รูกับแกน", "ขนานกัน", "ห่างกัน"], answer: 0 },
            { category: "Assembly", question: "เพลากับรู ควรใช้ Mate แบบใด?", options: ["Parallel", "Tangent", "Concentric", "Width"], answer: 2 },
            { category: "Assembly", question: "Distance Mate ใช้ทำอะไร?", options: ["วัดระยะ", "กำหนดระยะห่างที่แน่นอน", "หาจุดกึ่งกลาง", "จำลองเฟือง"], answer: 1 },
            { category: "Assembly", question: "หมุนชิ้นงาน (Rotate) ใน Assembly ใช้ปุ่มเมาส์ใด?", options: ["คลิกซ้ายค้าง", "คลิกขวาค้าง", "ลูกกลิ้ง", "Ctrl+ซ้าย"], answer: 1 },
            { category: "Assembly", question: "ย้ายที่ชิ้นงาน (Move) ใน Assembly ใช้ปุ่มเมาส์ใด?", options: ["คลิกซ้ายค้าง", "คลิกขวาค้าง", "ลูกกลิ้ง", "Shift+ซ้าย"], answer: 0 },
            { category: "Assembly", question: "Tangent Mate ใช้กับผิวแบบใด?", options: ["แบน-แบน", "โค้ง-แบน", "รู-แกน", "จุด-จุด"], answer: 1 },
            { category: "Assembly", question: "จัดชิ้นงานให้อยู่กึ่งกลางร่องพอดีใช้?", options: ["Center Mate", "Symmetric", "Width Mate", "Profile Center"], answer: 2 },
            { category: "Assembly", question: "Mechanical Mates ใช้ทำอะไร?", options: ["คำนวณราคา", "จำลองกลไก เช่น เฟือง, สกรู", "ใส่แรงกด", "ทำภาพเคลื่อนไหว"], answer: 1 },
            { category: "Assembly", question: "Interference Detection ใช้ตรวจสอบอะไร?", options: ["น้ำหนัก", "การชนกัน/ซ้อนทับกัน", "สี", "ขนาดกระดาษ"], answer: 1 },
            { category: "Assembly", question: "คำสั่งทำภาพถอดแยกชิ้นส่วนคือ?", options: ["Exploded View", "Break View", "Section", "Split"], answer: 0 },
            { category: "Assembly", question: "เส้นแสดงทิศทางการประกอบใน Explode คือ?", options: ["Guide Line", "Explode Line Sketch", "Centerline", "Path"], answer: 1 },
            { category: "Assembly", question: "ปุ่มคีย์ลัดซ่อน Part อย่างเร็วคือ?", options: ["Space", "Tab", "Delete", "Esc"], answer: 1 },
            { category: "Assembly", question: "ยกเลิกการซ่อน Part (Show) ใช้ปุ่ม?", options: ["Shift+Tab", "Ctrl+Tab", "Alt+Tab", "Ctrl+H"], answer: 0 },
            { category: "Assembly", question: "Pack and Go มีไว้ทำอะไร?", options: ["บีบอัดไฟล์", "รวบรวมไฟล์ที่เกี่ยวข้องทั้งหมดเพื่อส่งต่อ", "ลงโปรแกรมใหม่", "ลบไฟล์"], answer: 1 },
            { category: "Assembly", question: "Sub-assembly คือ?", options: ["ไฟล์อะไหล่", "การประกอบย่อยภายในไฟล์หลัก", "คำสั่งลดขนาด", "ระบบสำรอง"], answer: 1 },
            { category: "Assembly", question: "แก้ไข Part ขณะอยู่ใน Assembly เรียกว่า?", options: ["Edit Assembly", "Edit Component", "Edit Feature", "Quick Edit"], answer: 1 },
            { category: "Assembly", question: "คำสั่งเจาะรูพร้อมกันหลายชิ้นใน Assembly คือ?", options: ["Smart Cut", "Assembly Features", "Master Cut", "Global Cut"], answer: 1 },
            { category: "Assembly", question: "Copy Part ในหน้าจอใช้ปุ่ม?", options: ["Ctrl+ลาก", "Shift+ลาก", "Alt+ลาก", "D+ลาก"], answer: 0 },
            { category: "Assembly", question: "คลังน็อต สกรู มาตรฐานคือ?", options: ["Library", "Toolbox", "Store", "Standard Parts"], answer: 1 },
            { category: "Assembly", question: "Gear Mate ใช้ทำอะไร?", options: ["เชื่อมสี", "จำลองการหมุนของเฟือง", "ล็อกตำแหน่ง", "วัดความเร็ว"], answer: 1 },
            { category: "Assembly", question: "ตรวจสอบช่องว่างที่น้อยที่สุดใช้?", options: ["Measure", "Clearance Verification", "Collision", "Gap Finder"], answer: 1 },
            { category: "Assembly", question: "สัญลักษณ์ (-) หน้าชื่อ Part หมายถึง?", options: ["Error", "Fixed", "Under Defined", "Hidden"], answer: 2 },
            { category: "Assembly", question: "Lock Mate คือ?", options: ["ล็อกชิ้นงานให้ติดกันทุกทิศทาง", "ล็อกความยาว", "ล็อกมุม", "ล็อกสี"], answer: 0 },
            { category: "Assembly", question: "ไฟล์ .sldasm เก็บข้อมูลอย่างไร?", options: ["เก็บ 3D ทั้งหมดในไฟล์เดียว", "เก็บลิงก์อ้างอิงไปยังไฟล์ .sldprt", "เก็บเป็นรูปภาพ", "เก็บเป็น Excel"], answer: 1 },
            { category: "Assembly", question: "หากย้ายไฟล์ Part ไปที่อื่นโดยไม่ใช้ Pack and Go จะเกิดอะไรขึ้น?", options: ["เปิดไฟล์ Assembly ไม่ขึ้น", "ไฟล์ Assembly จะหายไป", "สีจะเพี้ยน", "ขนาดจะเล็กลง"], answer: 0 },

            // DRAWING (61-90)
            { category: "Drawing", question: "นามสกุลไฟล์ Drawing คือ?", options: [".sldprt", ".sldasm", ".slddrw", ".dwg"], answer: 2 },
            { category: "Drawing", question: "ดึง 3 มุมมองมาตรฐานอัตโนมัติใช้?", options: ["Model View", "Standard 3 View", "Projected View", "Auto View"], answer: 1 },
            { category: "Drawing", question: "พับมุมมองต่อจากรูปเดิมใช้?", options: ["Projected View", "Next View", "Auxiliary", "Copy View"], answer: 0 },
            { category: "Drawing", question: "ทำภาพตัดขวาง (ผ่ากลาง) ใช้?", options: ["Break View", "Detail View", "Section View", "Crop View"], answer: 2 },
            { category: "Drawing", question: "ขยายส่วนเล็กๆ ให้ดูง่ายใช้?", options: ["Zoom View", "Detail View", "Scale View", "Large View"], answer: 1 },
            { category: "Drawing", question: "ตัดย่อส่วนงานที่ยาวเกินกระดาษใช้?", options: ["Crop View", "Break View", "Split View", "Short View"], answer: 1 },
            { category: "Drawing", question: "ทำภาพฉายตั้งฉากกับผิวเอียงใช้?", options: ["Angle View", "Projected", "Auxiliary View", "Normal View"], answer: 2 },
            { category: "Drawing", question: "Hidden Lines คือเส้นแบบใด?", options: ["เส้นทึบ", "เส้นประ", "เส้นสีแดง", "ไม่มีเส้น"], answer: 1 },
            { category: "Drawing", question: "สัญลักษณ์กึ่งกลางวงกลมคือ?", options: ["Centerline", "Center Mark", "Dot", "Axis"], answer: 1 },
            { category: "Drawing", question: "เส้นแสดงแกนสมมาตรคือ?", options: ["Center Mark", "Centerline", "Guide", "Link"], answer: 1 },
            { category: "Drawing", question: "ดึงขนาดจาก 3D มาโชว์อัตโนมัติใช้?", options: ["Smart Dimension", "Auto Dimension", "Model Items", "Get Dim"], answer: 2 },
            { category: "Drawing", question: "ตารางรายการชิ้นส่วนคือ?", options: ["Part List", "BOM", "Table", "Summary"], answer: 1 },
            { category: "Drawing", question: "ใส่เลขลูกโป่งชี้ชิ้นส่วนทั้งหมดอัตโนมัติใช้?", options: ["Auto Balloon", "Smart Balloon", "Easy Balloon", "Balloon All"], answer: 0 },
            { category: "Drawing", question: "กรอบข้อมูลล่างขวากระดาษคือ?", options: ["Title Block", "Note Box", "Footer", "Info Panel"], answer: 0 },
            { category: "Drawing", question: "แก้ไขกรอบกระดาษต้องเลือกอะไร?", options: ["Edit Sheet", "Edit Sheet Format", "Edit Template", "Edit Layout"], answer: 1 },
            { category: "Drawing", question: "บอกรายละเอียดรูเจาะและเกลียวใช้?", options: ["Smart Dim", "Hole Callout", "Hole Table", "Fastener Info"], answer: 1 },
            { category: "Drawing", question: "GD&T ใช้สำหรับกำหนดอะไร?", options: ["สี", "พิกัดความเผื่อทางเรขาคณิต", "น้ำหนัก", "วันที่"], answer: 1 },
            { category: "Drawing", question: "Surface Finish Symbol บอกอะไร?", options: ["สี", "ความหยาบผิว", "ขนาด", "วัสดุ"], answer: 1 },
            { category: "Drawing", question: "สเกล 1:2 หมายความว่าอย่างไร?", options: ["ใหญ่กว่าจริง 2 เท่า", "เท่าของจริง", "เล็กกว่าจริงครึ่งหนึ่ง", "ไม่แน่นอน"], answer: 2 },
            { category: "Drawing", question: "บอกขนาดต่อเนื่องจากจุดศูนย์ (0,0) ใช้?", options: ["Smart Dim", "Ordinate Dimension", "Baseline", "Chain"], answer: 1 },
            { category: "Drawing", question: "พิมพ์ข้อความอิสระในแบบใช้?", options: ["Text", "Note", "Label", "Box"], answer: 1 },
            { category: "Drawing", question: "เซฟเป็นไฟล์อะไรเพื่อให้คนไม่มีโปรแกรมเปิดดูได้?", options: [".slddrw", ".dwg", ".pdf", ".igs"], answer: 2 },
            { category: "Drawing", question: "Revision Table ใช้บันทึกอะไร?", options: ["รายการของ", "ประวัติการแก้ไขแบบ", "พิกัดรู", "ราคา"], answer: 1 },
            { category: "Drawing", question: "ไฟล์ Drawing จะโชว์ภาพได้ต้องมีไฟล์อะไรประกอบ?", options: ["Drawing อย่างเดียว", "ต้องมีไฟล์ Part/Assembly ไปด้วย", "ต้องมี Word", "ต้องมี Excel"], answer: 1 },
            { category: "Drawing", question: "โหมด Hidden Lines Visible โชว์เส้นแบบใด?", options: ["ภาพทึบ", "เส้นขอบนอกและเส้นประข้างใน", "เส้นสเกตช์", "ภาพสี"], answer: 1 },
            { category: "Drawing", question: "Tangent Edge คือเส้นอะไร?", options: ["ขอบกระดาษ", "เส้นรอยต่อผิวโค้งกับผิวเรียบ", "เส้นบอกมุม", "จุดศูนย์กลาง"], answer: 1 },
            { category: "Drawing", question: "เพิ่มหน้ากระดาษแผ่นที่ 2 ทำอย่างไร?", options: ["กด Add Sheet ด้านล่าง", "สร้างไฟล์ใหม่", "Insert Component", "เพิ่มไม่ได้"], answer: 0 },
            { category: "Drawing", question: "Hole Table บอกข้อมูลอะไร?", options: ["ชื่อคนเขียน", "พิกัดและขนาดรูเจาะทั้งหมด", "ราคาวัสดุ", "น้ำหนัก"], answer: 1 },
            { category: "Drawing", question: "Crop View ทำหน้าที่อะไร?", options: ["ขยายภาพ", "ตัดส่วนที่ไม่ต้องการในวิวออก", "เพิ่มภาพใหม่", "ลบวิว"], answer: 1 },
            { category: "Drawing", question: "แก้ไขขนาดใน Drawing (Model Items) จะมีผลอย่างไร?", options: ["ไม่มีผล", "ไฟล์ Part จะพัง", "ขนาดใน 3D Part จะเปลี่ยนตาม", "แก้ไม่ได้"], answer: 2 }
        ];

        let currentQuestion = 0;
        let score = 0;
        let selectedOption = null;
        let isAnswerSubmitted = false;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const progressText = document.getElementById('question-progress');
        const categoryBadge = document.getElementById('category-badge');
        const scoreLiveText = document.getElementById('score-live');

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            isAnswerSubmitted = false;
            nextBtn.disabled = true;
            nextBtn.textContent = "ยืนยันคำตอบ";
            nextBtn.classList.replace('bg-green-600', 'bg-blue-600');

            const qData = quizData[currentQuestion];
            progressText.textContent = `ข้อ ${currentQuestion + 1} / ${quizData.length}`;
            questionText.textContent = qData.question;
            
            // ปรับสี Badge ตามหมวดหมู่
            categoryBadge.textContent = qData.category;
            categoryBadge.className = "text-sm font-medium py-1 px-3 rounded-full border " + 
                (qData.category === 'Part Modeling' ? 'text-purple-700 bg-purple-100 border-purple-200' : 
                 qData.category === 'Assembly' ? 'text-blue-700 bg-blue-100 border-blue-200' : 
                 'text-green-700 bg-green-100 border-green-200');

            optionsContainer.innerHTML = '';
            qData.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-4 border-2 border-gray-200 rounded-xl text-gray-700 font-medium hover:bg-gray-50 focus:outline-none";
                btn.innerHTML = `<span class="inline-block w-8 text-gray-400 font-bold">${String.fromCharCode(65 + index)}.</span> ${opt}`;
                btn.onclick = () => !isAnswerSubmitted && selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(index, btn) {
            selectedOption = index;
            Array.from(optionsContainer.children).forEach(b => b.classList.remove('option-selected'));
            btn.classList.add('option-selected');
            nextBtn.disabled = false;
        }

        function handleNextClick() {
            if (!isAnswerSubmitted) {
                isAnswerSubmitted = true;
                const qData = quizData[currentQuestion];
                const btns = optionsContainer.children;
                
                Array.from(btns).forEach((btn, i) => {
                    btn.disabled = true;
                    if (i === qData.answer) {
                        btn.classList.add('bg-green-50', 'border-green-500', 'text-green-800');
                        btn.innerHTML += ' <span class="float-right text-green-600">✓ ถูกต้อง</span>';
                    } else if (i === selectedOption) {
                        btn.classList.add('bg-red-50', 'border-red-400', 'text-red-700');
                        btn.innerHTML += ' <span class="float-right text-red-500">✗ ผิด</span>';
                    } else {
                        btn.classList.add('opacity-40');
                    }
                });

                if (selectedOption === qData.answer) score++;
                scoreLiveText.textContent = `คะแนน: ${score}`;
                
                nextBtn.textContent = currentQuestion < quizData.length - 1 ? "ข้อถัดไป ➔" : "ดูผลคะแนน";
                nextBtn.classList.replace('bg-blue-600', 'bg-green-600');
            } else {
                currentQuestion++;
                if (currentQuestion < quizData.length) {
                    loadQuestion();
                    window.scrollTo({top: 0, behavior: 'smooth'});
                } else {
                    showResults();
                }
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
            
            const interp = document.getElementById('score-interpretation');
            const pct = (score / quizData.length) * 100;
            if (pct >= 90) interp.textContent = "🏆 ระดับเซียน! คุณมีความรู้แน่นปึกทุกด้าน", interp.className = "mt-4 text-green-600";
            else if (pct >= 70) interp.textContent = "✨ ยอดเยี่ยม! มีทักษะพร้อมทำงานจริง", interp.className = "mt-4 text-blue-600";
            else if (pct >= 50) interp.textContent = "👍 สอบผ่าน! ฝึกฝนเครื่องมือที่ทำผิดบ่อยๆ นะ", interp.className = "mt-4 text-yellow-600";
            else interp.textContent = "💪 พยายามอีกนิด! ลองกลับไปทบทวนบทเรียนดูนะ", interp.className = "mt-4 text-red-600";
            
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    </script>
</body>
